<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ติดตามสถานะน้อง · Panalai SMART OR</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  หน้าเจ้าของ (ฝากบน GitHub Pages) — ดัดแปลงจาก Track.html
  ดึงข้อมูลจาก Apps Script ?api=track แบบไม่ส่ง cookie ของ Google
  จึงเปิดได้แม้ Chrome ล็อกอิน Google หลายบัญชี
-->
<style>
  :root { --bg:#eef6f4; --card:#fff; --ink:#0f2b27; --mute:#6b8580; --line:#dbe8e5; --brand:#0f766e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  .wrap { max-width:520px; margin:0 auto; padding:16px 16px 40px; }
  .brand { text-align:center; padding:4px 0 14px; }
  .brand img { width:132px; height:auto; display:block; margin:0 auto; }
  .card { background:var(--card); border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(15,43,39,.06); }
  .hero { border-top:6px solid var(--c); }
  .pet { font-size:26px; font-weight:700; }
  .sub { color:var(--mute); font-size:14px; margin-top:2px; }
  .now { margin-top:14px; display:flex; gap:12px; align-items:center; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--c); box-shadow:0 0 0 6px color-mix(in srgb, var(--c) 20%, transparent); flex:none; animation:pulse 2s infinite; }
  .now b { font-size:21px; color:var(--c); display:block; }
  .now span { font-size:15px; }
  .late { margin-top:12px; background:#fffbeb; color:#92400e; border-radius:12px; padding:10px 12px; font-size:15px; }
  /* ข้อความจากหมออยู่ในการ์ดบนที่เดียว (แทนข้อความอัตโนมัติของสถานะ) */
  .msg { margin-top:12px; background:#f0fdfa; border-left:4px solid var(--brand); border-radius:12px; padding:10px 12px; font-size:15px; }
  .msg .t { font-size:13px; color:var(--mute); margin-bottom:4px; }
  .photo img { width:100%; border-radius:14px; display:block; }
  .photo .t { font-size:13px; color:var(--mute); margin-top:8px; text-align:center; }
  svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block; }
  /* หัวข้อการ์ด: ไอคอนในกรอบ + ชื่อ + คำอธิบาย */
  .head { display:flex; gap:12px; align-items:center; margin-bottom:16px; }
  .tile { width:44px; height:44px; border-radius:13px; background:#eef6f4; color:var(--brand); display:flex; align-items:center; justify-content:center; flex:none; }
  .head b { font-size:17px; display:block; }
  .head span { font-size:13px; color:var(--mute); }
  /* ไทม์ไลน์ */
  .steps { list-style:none; margin:0; padding:0; }
  .steps li { position:relative; display:flex; gap:14px; padding-bottom:20px; }
  .steps li:last-child { padding-bottom:0; }
  .steps li::before { content:''; position:absolute; left:21px; top:46px; bottom:2px; width:2px; background:var(--line); }
  .steps li:last-child::before { display:none; }
  .steps li.done::before { background:var(--brand); }
  .ic { width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; border:2px solid var(--line); background:#fff; color:#a3b6b2; }
  .done .ic { background:var(--brand); border-color:var(--brand); color:#fff; }
  .current .ic { background:var(--c); border-color:var(--c); color:#fff; box-shadow:0 0 0 6px color-mix(in srgb, var(--c) 18%, transparent); animation:pulse 2s infinite; }
  .steps .lb { font-weight:700; padding-top:2px; }
  .steps .ds { font-size:13px; color:var(--mute); }
  .steps .tm { font-size:14px; color:var(--brand); font-weight:700; margin-top:2px; }
  .current .tm { color:var(--c); }
  .todo .lb, .todo .ds { color:#a3b6b2; }
  .eta { display:flex; gap:14px; align-items:center; background:#fffbeb; }
  .eta .tile { background:#fef3c7; color:#b45309; }
  .eta b { font-size:22px; display:block; }
  .eta .t { font-size:13px; color:var(--mute); }
  .contact .head { margin-bottom:12px; }
  .call { display:flex; gap:8px; align-items:center; justify-content:center; background:var(--brand); color:#fff; text-decoration:none; padding:14px; border-radius:14px; font-weight:700; font-size:17px; }
  .foot { text-align:center; color:var(--mute); font-size:13px; margin-top:14px; }
  .center { text-align:center; padding:60px 20px; color:var(--mute); }
  @keyframes pulse { 50% { opacity:.55; } }
</style>
</head>
<body>
<div class="wrap"><div class="brand"><img src="logo.png" alt="โรงพยาบาลสัตว์พนาลัย" width="400" height="380"></div><div id="root"><div class="center">กำลังโหลดข้อมูล…</div></div></div>

<script>
// ลิงก์ /exec ของ web app (deployment เดิม) — ถ้าเปลี่ยน deployment ต้องแก้ตรงนี้
const API_URL = 'https://script.google.com/macros/s/AKfycbw-1oqWH-aIIkdPcVh2mTjusdl6mCrSv1UiHQOwEqqeZ903aL-5bXdhghHKk6DJoRL5zQ/exec';
const TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-f0-9]/gi, '').slice(0, 64);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// "092-239-5447 ต่อ 1" → tel:0922395447,1 (มือถือโทรแล้วกดเบอร์ต่อให้เอง)
const telHref = p => { const [num, ext] = String(p).split(/ต่อ|ext\.?|#/i); const x = String(ext || '').replace(/\D/g, ''); return 'tel:' + num.replace(/[^\d+]/g, '') + (x ? ',' + x : ''); };
const pad = n => String(n).padStart(2, '0');
// แสดงเวลาไทยเสมอ แม้มือถือเจ้าของตั้งโซนเวลาอื่น
const bkk = t => new Date(t + 7 * 3600e3);
const hm = t => { const d = bkk(t); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const dt = t => { const d = bkk(t); return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + (d.getUTCFullYear() + 543) + ' ' + hm(t); };
let LAST = '', busy = false;

// ไอคอนเส้น (24x24) — คีย์ PRE/OR/POST ตรงกับ OWNER_STEPS ใน Code.gs
const svg = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICON = {
  PRE: svg('<path d="M9 4h6v3H9z"/><path d="M9 5.5H6V20h12V5.5h-3"/><path d="m9 13.5 2 2 4-4"/>'),
  OR: svg('<path d="M3 12h4l2-5 4 10 2-5h6"/>'),
  POST: svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
  list: svg('<path d="M5 7h14M5 12h14M5 17h9"/>'),
  clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  help: svg('<path d="M5 13v-1a7 7 0 0 1 14 0v1"/><rect x="4" y="13" width="4" height="6" rx="1.5"/><rect x="16" y="13" width="4" height="6" rx="1.5"/>'),
  phone: svg('<path d="M5 4h3.5l2 5-2.5 1.5a11 11 0 0 0 5.5 5.5L15 13.5l5 2V19a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),
};

async function load() {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch(API_URL + '?api=track&t=' + TOKEN, { credentials: 'omit', cache: 'no-store' });
    draw(await res.json());
  } catch (e) {
    if (!LAST) $('root').innerHTML = '<div class="center">เชื่อมต่อไม่ได้ กำลังลองใหม่…</div>';
  } finally { busy = false; }
}

function draw(d) {
  const key = JSON.stringify(Object.assign({}, d, { now: 0 }));
  if (key === LAST) { const f = document.querySelector('.foot'); if (f) f.textContent = 'อัปเดตอัตโนมัติ · ล่าสุด ' + hm(d.now); return; }
  LAST = key;
  if (d.error) {
    $('root').innerHTML = `<div class="card center">${esc(d.error)}</div>` +
      (d.phone ? `<a class="call" href="${telHref(d.phone)}">📞 โทร ${esc(d.phone)}</a>` : '');
    return;
  }
  document.title = 'น้อง' + d.petName + ' · ' + d.statusLabel + ' · Panalai SMART OR';
  // ข้อความอัตโนมัติของสถานะซ้ำกับคำอธิบายในไทม์ไลน์ → แสดงเฉพาะสถานะจบ (พร้อมรับกลับ ฯลฯ) และเมื่อไม่มีข้อความจากหมอ
  const quiet = d.message || d.delayed || d.steps.some(s => s.state === 'current');
  $('root').innerHTML = `
    <div class="card hero" style="--c:${d.color}">
      <div class="pet">น้อง${esc(d.petName)}</div>
      <div class="sub">รหัส ${esc(d.code)}${d.procedure ? ' · ' + esc(d.procedure) : ''}${d.doctor ? ' · ' + esc(d.doctor) : ''}</div>
      <div class="now"><div class="dot"></div><div><b>${esc(d.statusLabel)}</b>${quiet ? '' : `<span>${esc(d.statusText)}</span>`}</div></div>
      ${d.message ? `<div class="msg"><div class="t">ข้อความจากทีมหมอ · ${hm(d.messageAt)}</div>${esc(d.message)}</div>`
        : d.delayed ? '<div class="late">การผ่าตัดใช้เวลานานกว่าที่คาดไว้เล็กน้อย ทีมหมอยังดูแลน้องอย่างใกล้ชิด หากมีข้อมูลเพิ่มเติมเจ้าหน้าที่จะแจ้งให้ทราบ</div>' : ''}
    </div>
    ${d.photoUrl ? `<div class="card photo"><img src="${esc(d.photoUrl)}" alt="รูปน้อง" referrerpolicy="no-referrer"><div class="t">รูปล่าสุดของน้องจากทีมดูแล</div></div>` : ''}
    <div class="card" style="--c:${d.color}">
      <div class="head"><div class="tile">${ICON.list}</div><div><b>ลำดับการดูแล</b><span>วันและเวลาของแต่ละขั้นตอนสำคัญ</span></div></div>
      <ul class="steps">${d.steps.map(s => `
        <li class="${s.state}"><div class="ic">${ICON[s.key] || ''}</div>
          <div><div class="lb">${esc(s.label)}</div>
          ${s.desc ? `<div class="ds">${esc(s.desc)}</div>` : ''}
          ${s.t ? `<div class="tm">${dt(s.t)}</div>` : ''}</div>
        </li>`).join('')}</ul>
    </div>
    ${d.eta ? `<div class="card eta"><div class="tile">${ICON.clock}</div><div><div class="t">เวลาประมาณที่รับน้องกลับได้</div><b>${dt(d.eta)}</b><div class="t">เวลาอาจเปลี่ยนแปลงตามแผนการดูแลของทีมหมอ</div></div></div>` : ''}
    ${d.phone ? `<div class="card contact">
      <div class="head"><div class="tile">${ICON.help}</div><div><span>ต้องการสอบถามข้อมูลเพิ่มเติม</span><b>ติดต่อเคาน์เตอร์${esc(d.hospital || '')}</b></div></div>
      <a class="call" href="${telHref(d.phone)}">${ICON.phone} ${esc(d.phone)}</a></div>` : ''}
    <div class="foot">อัปเดตอัตโนมัติ · ล่าสุด ${hm(d.now)}</div>`;
}

if (TOKEN.length < 20) {
  $('root').innerHTML = '<div class="card center">ไม่พบข้อมูล กรุณาสแกน QR จากบัตรติดตามอีกครั้ง</div>';
} else {
  load();
  setInterval(load, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
}
</script>
</body>
</html>
